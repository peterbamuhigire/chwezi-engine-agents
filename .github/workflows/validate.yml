name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Validate plugin
        run: python .codex-plugin/../scripts/validate-contracts.py --schema schemas/engine-catalog.schema.json --instance catalog/engines.yaml
      - name: Validate catalog and adapters
        shell: pwsh
        run: |
          ./tests/validate_catalog.ps1
          ./tests/adapters/test_codex_adapter.ps1
          ./tests/adapters/test_claude_code_adapter.ps1
          ./tests/adapters/test_other_host_adapters.ps1
      - name: Validate install, security, and evaluations
        shell: pwsh
        run: |
          ./tests/install/test_install_targets.ps1
          ./tests/install/test_fork_discovery.ps1
          ./tests/security/test_path_boundaries.ps1
          ./tests/security/test_mutation_gates.ps1
          ./tests/security/test_command_allowlist.ps1
          ./evals/runners/run-host-smoke-tests.ps1
      - name: Run deterministic evaluations
        run: python evals/runners/run-contract-evals.py --cases evals/cases --out evals/reports/ci.json
      - name: Check runtime skill budget (package skills)
        run: python -X utf8 scripts/validate-runtime-skill-budget.py --root skills
      - name: Test drift-control and snapshot tooling
        run: |
          python -m pip install pytest
          python -X utf8 -m pytest tests/test_render_host_files.py tests/test_kaizen_portfolio_snapshot.py -q -p no:cacheprovider
      - name: Test routing, oracle, schema and marketplace tooling (M10-03)
        run: |
          python -X utf8 -m pytest tests/test_validate_runtime_skill_budget.py tests/test_run_contract_evals.py tests/test_validate_routing_baseline.py tests/test_validation_result_schema.py tests/test_marketplace_relevance.py -q -p no:cacheprovider
          python -X utf8 scripts/validate-routing-baseline.py
      - name: Test project context, fan-in, tours, skill graph and usage scan (M10-12)
        run: |
          python -X utf8 -m pytest tests/test_project_context_doctor.py tests/test_skill_fanin.py tests/test_generate_engine_tour.py tests/test_skill_graph.py tests/test_skill_usage_scan.py -q -p no:cacheprovider
          python -X utf8 scripts/validate-contracts.py --schema schemas/project-context.schema.json --instance templates/project-context/PROJECT.md
          python -X utf8 scripts/project_context_doctor.py --project tests/fixtures/project-context/valid/PROJECT.md --workspace-root tests/fixtures/project-context/workspace --json
          python -X utf8 scripts/generate_engine_tour.py --workspace-root tests/fixtures/engine-workspace --engine demo-engine --out-dir "$env:RUNNER_TEMP/tours"
          python -X utf8 scripts/generate_engine_tour.py --workspace-root tests/fixtures/engine-workspace --engine demo-engine --out-dir "$env:RUNNER_TEMP/tours" --check
      - name: Build and test MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          npm test
      - name: Check whitespace
        shell: bash
        run: git diff --check

  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Check POSIX scripts
        run: bash -n scripts/install.sh scripts/update.sh scripts/uninstall.sh
      - name: Run contract evaluations
        run: python evals/runners/run-contract-evals.py --cases evals/cases --out evals/reports/posix.json
      - name: Build and test MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          npm test

  portfolio-drift:
    # Read-only drift check across the eleven public engines (M10-02-T14). Each engine is checked
    # out as a sibling of this package. A missing sibling is NOT_ASSESSED (exit 3), which fails the
    # job: it is never reported as a pass. The private political-essay engine is never checked out.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: chwezi-engine-agents
    steps:
      - uses: actions/checkout@v4
        with:
          path: chwezi-engine-agents
      - {name: Check out chwezi-sdlc-documentation, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-sdlc-documentation, path: chwezi-sdlc-documentation}}
      - {name: Check out business-plan-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/business-plan-skills, path: business-plan-skills}}
      - {name: Check out website-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/website-skills, path: website-skills}}
      - {name: Check out social-media-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/social-media-skills, path: social-media-skills}}
      - {name: Check out linux-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/linux-skills, path: linux-skills}}
      - {name: Check out proposal-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/proposal-skills, path: proposal-skills}}
      - {name: Check out chwezi-dev-engine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-dev-engine, path: chwezi-dev-engine}}
      - {name: Check out chwezi-accounting-doctrine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-accounting-doctrine, path: chwezi-accounting-doctrine}}
      - {name: Check out chwezi-design-engine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-design-engine, path: chwezi-design-engine}}
      - {name: Check out digital-research-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/digital-research-skills, path: digital-research-engine}}
      - {name: Check out windows-admin-engine-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/windows-admin-engine-skills, path: windows-admin-engine-skills}}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install PyYAML
      - name: Host files, invariants, versions, hooks and shared-asset register
        run: python -X utf8 scripts/render_host_files.py --check --workspace-root ..
      - name: Marketplace counts and sources
        run: node scripts/generate-plugin-manifest.js --check-marketplace --workspace-root ..
      - name: Prompt-contract byte identity
        run: ./scripts/validate-prompt-capability.ps1 -WorkspaceRoot (Resolve-Path ..).Path -CoordinatorRoot (Get-Location).Path

  portfolio-routing:
    # Tier 2 portfolio routing gate (M10-03-T17): union collision scan against the ownership register
    # and the cross-engine route oracles. Lexical proxy; not live routing (agent-skills issue #620).
    # The eleven public engines are shallow-checked-out as siblings; the private political-essay
    # engine is never checked out. A missing sibling reports NOT_ASSESSED in the log and step summary,
    # never a pass. To switch the gate to report-only, add --report-only to the collision step.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chwezi-engine-agents
    steps:
      - uses: actions/checkout@v4
        with:
          path: chwezi-engine-agents
      - {name: Check out chwezi-sdlc-documentation, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-sdlc-documentation, path: chwezi-sdlc-documentation}}
      - {name: Check out business-plan-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/business-plan-skills, path: business-plan-skills}}
      - {name: Check out website-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/website-skills, path: website-skills}}
      - {name: Check out social-media-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/social-media-skills, path: social-media-skills}}
      - {name: Check out linux-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/linux-skills, path: linux-skills}}
      - {name: Check out proposal-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/proposal-skills, path: proposal-skills}}
      - {name: Check out chwezi-dev-engine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-dev-engine, path: chwezi-dev-engine}}
      - {name: Check out chwezi-accounting-doctrine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-accounting-doctrine, path: chwezi-accounting-doctrine}}
      - {name: Check out chwezi-design-engine, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/chwezi-design-engine, path: chwezi-design-engine}}
      - {name: Check out digital-research-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/digital-research-skills, path: digital-research-engine}}
      - {name: Check out windows-admin-engine-skills, uses: actions/checkout@v4, continue-on-error: true, with: {repository: peterbamuhigire/windows-admin-engine-skills, path: windows-admin-engine-skills}}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install PyYAML
      - name: Union collision scan with ownership register
        shell: bash
        run: |
          set +e
          python -X utf8 scripts/validate-runtime-skill-budget.py --collisions --ownership evals/routing/ownership.yaml --workspace-root ..
          code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::portfolio collision scan NOT_ASSESSED (a sibling engine is unavailable); this is not a pass"
            echo "portfolio collision scan: NOT_ASSESSED (sibling unavailable)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
      - name: Cross-engine route oracles (floor from evals/routing/baseline.json)
        shell: bash
        run: |
          set +e
          floor=$(python -c "import json; print(json.load(open('evals/routing/baseline.json'))['portfolio']['floor'])")
          python -X utf8 evals/runners/run-contract-evals.py --cases evals/cases --route-oracles --workspace-root .. --min-oracle-primary "$floor" --out "$RUNNER_TEMP/oracles.json"
          code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::route oracles NOT_ASSESSED (a sibling engine is unavailable); this is not a pass"
            echo "route oracles: NOT_ASSESSED (sibling unavailable)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
