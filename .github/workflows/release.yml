name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install PyYAML jsonschema
      - run: python scripts/validate-contracts.py --schema schemas/engine-catalog.schema.json --instance catalog/engines.yaml
      - run: python evals/runners/run-contract-evals.py --cases evals/cases --out evals/reports/release.json
      - working-directory: mcp-server
        run: npm ci && npm run build && npm test
      - name: Package and checksum
        shell: bash
        run: |
          mkdir -p release/build
          git archive --format=tar.gz --prefix=skills-engine-agents/ HEAD -o release/build/skills-engine-agents.tar.gz
          sha256sum release/build/skills-engine-agents.tar.gz > release/checksums.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: skills-engine-agents-release
          path: |
            release/checksums.txt
            evals/reports/release.json
