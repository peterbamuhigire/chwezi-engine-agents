schema_version: "1.0"
version: 1
engines:
  - id: chwezi-sdlc-documentation
    repository: chwezi-sdlc-documentation
    path: chwezi-sdlc-documentation
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "905b9a4"}
    validators:
      - "python -X utf8 scripts/validate_skill_engine.py --baseline tests/skill-quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
  - id: business-plan-skills
    repository: business-plan-skills
    path: business-plan-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "2b41c08"}
    validators:
      - "python -X utf8 scripts/validate_skill_engine.py --baseline docs/quality/skill-quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py --threshold 1.0"
  - id: website-skills
    repository: website-skills
    path: website-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "75bc5c9"}
    validators:
      - "python scripts/validate-skill-registry.py"
      - "python scripts/website_fixture_benchmark.py"
      - "python scripts/routing-smoke-test.py"
  - id: social-media-skills
    repository: social-media-skills
    path: social-media-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "724970f"}
