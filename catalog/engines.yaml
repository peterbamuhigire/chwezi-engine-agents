    repository: linux-skills
    path: linux-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "9de82cf"}
    validators:
      - "python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "bash scripts/tests/check-distro-matrix.sh"
  - id: proposal-skills
    repository: proposal-skills
    path: proposal-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "ba94f15"}
    validators:
      - "python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
  - id: chwezi-dev-engine
    repository: chwezi-dev-engine
    path: chwezi-dev-engine
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "b3161da"}
    validators:
      - "python scripts/validate_engine_control_plane.py --workspace-root .."
      - "python scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/skill_catalog_guardrails.py"
  - id: chwezi-accounting-doctrine
    repository: chwezi-accounting-doctrine
    path: chwezi-accounting-doctrine
    router: README.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "8c1d683"}
    validators:
      - ".\\tools\\validate-doctrine.ps1 -Strict"
  - id: chwezi-design-engine
    repository: chwezi-design-engine
    path: chwezi-design-engine
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "f69c5d4"}
    validators:
