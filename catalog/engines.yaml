schema_version: "1.0"
version: 1
engines:
  - id: chwezi-sdlc-documentation
    repository: chwezi-sdlc-documentation
    path: chwezi-sdlc-documentation
    router: AGENTS.md
    aliases: [srs-skills]
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "05df319"}
    validators:
      - "python -X utf8 scripts/validate_skill_engine.py --baseline tests/skill-quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
  - id: business-plan-skills
    repository: business-plan-skills
    path: business-plan-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "00a85b1"}
    validators:
      - "python -X utf8 scripts/validate_skill_engine.py --baseline docs/quality/skill-quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py --threshold 1.0"
  - id: website-skills
    repository: website-skills
    path: website-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "ebb3225"}
    validators:
      - "python scripts/validate-skill-registry.py"
      - "python scripts/website_fixture_benchmark.py"
      - "python scripts/routing-smoke-test.py"
      - "python scripts/validate-skill-contracts.py --baseline quality/skill-contract-baseline.json"
      - "python scripts/validate-search-doctrine.py"
      - "python scripts/validate-source-registers.py"
      - "python scripts/check_portable_references.py"
      - "python scripts/source_ingestion_guardrail.py --root ."
      - "python -m pytest -q"
  - id: social-media-skills
    repository: social-media-skills
    path: social-media-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "4145db8"}
    validators:
      - "python -X utf8 scripts/validate_skill_engine.py --baseline quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py --lint-fixtures"
      - "python -X utf8 scripts/check_source_freshness.py"
      - "python -X utf8 scripts/check_skill_aliases.py"
  - id: linux-skills
    repository: linux-skills
    path: linux-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "03cba72"}
    validators:
      - "python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "bash scripts/tests/check-distro-matrix.sh"
  - id: proposal-skills
    repository: proposal-skills
    path: proposal-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "60fb98e"}
    validators:
      - "python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/encoding_link_gate.py"
      - "python -X utf8 scripts/source_ingestion_guardrail.py"
      - "python scripts/proposal_fixture_check.py"
      - "python -X utf8 -m unittest discover -s tests"
      - "git diff --check"
  - id: chwezi-dev-engine
    repository: chwezi-dev-engine
    path: chwezi-dev-engine
    router: AGENTS.md
    aliases: [skills-web-dev]
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "6e828d5"}
    validators:
      - "python scripts/validate_engine_control_plane.py --workspace-root .."
      - "python scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/skill_catalog_guardrails.py"
  - id: chwezi-accounting-doctrine
    repository: chwezi-accounting-doctrine
    path: chwezi-accounting-doctrine
    router: README.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "74f89ed"}
    validators:
      - ".\\tools\\validate-doctrine.ps1 -Strict"
      - "python tools/source_register_integrity.py"
      - "python tools/check_machine_paths.py"
      - "python -m unittest discover -s tests -p 'test_*.py'"
  - id: chwezi-design-engine
    repository: chwezi-design-engine
    path: chwezi-design-engine
    router: AGENTS.md
    aliases: [design-system-skills]
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "6942ac7"}
    validators:
      - "python -X utf8 scripts/validate_engine.py --baseline tests/quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/validate_portability.py"
      - "node hooks/test-rendered-font-names.js"
      - "node --test tools/slop-detector/test/"
  - id: digital-research-skills
    repository: digital-research-skills
    path: digital-research-engine
    router: AGENTS.md
    aliases: [chwezi-research-engine]
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "7e257ab"}
    validators:
      - "python -X utf8 scripts/skill_contract_validator.py --baseline tests/skill-engine/quality-baseline.json"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/validate_engine.py"
      - "python -X utf8 scripts/validate_source_currency.py --registers-dir docs/source-registers"
  - id: windows-admin-engine-skills
    repository: windows-admin-engine-skills
    path: windows-admin-engine-skills
    router: AGENTS.md
    integration: {manifest: .skills-engine/engine-manifest.yaml, contract_version: "1.0", status: available, released_commit: "bfc327a"}
    validators:
      - "python -X utf8 scripts/validate_engine.py"
      - "python -X utf8 scripts/routing_smoke_test.py"
      - "python -X utf8 scripts/source_ingestion_guardrail.py"
      - "python -X utf8 -m unittest discover -s tests/python -v"
      - "python -X utf8 scripts/check_source_register.py"
      - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-powershell.ps1"
