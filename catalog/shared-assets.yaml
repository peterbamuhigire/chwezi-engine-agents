# Shared-asset register for the Chwezi public portfolio (M10-02-T05).
#
# Enforced read-only by scripts/render_host_files.py --check. Paths are relative to the
# workspace root that holds the sibling checkouts. Modes:
#   byte               copy is identical to the canonical file after CRLF normalisation
#   block              the text between the named markers is identical to the canonical block
#   registered-variant each copy's SHA-256 (CRLF-normalised) is recorded with an owner and a
#                      reason; any hash that is not registered fails
#   external           enforced by another named check; listed here so the register is complete
# "discover" globs (no "**") find copies on disk that the register does not list.
# To re-register a deliberate change, replace the hash, keep the owner and reason, and move
# review_date. The private political-essay engine is never listed.
schema_version: "1.0"
review_date: "2026-12-29"
public_repositories:
  - chwezi-dev-engine
  - design-system-skills
  - srs-skills
  - website-skills
  - digital-research-engine
  - proposal-skills
  - business-plan-skills
  - social-media-skills
  - linux-skills
  - chwezi-accounting-doctrine
  - windows-admin-engine-skills
  - chwezi-engine-agents

model_id_allowlist:
  # Files that quote a corrupted model ID on purpose (as a record of a repaired defect).
  - path: chwezi-dev-engine/docs/updates/2026-09-24-book-extraction-removal-and-kaizen.md
    reason: "Change record of the K12 repair; it quotes one corrupted identifier as an example of what was fixed."

coordination:
  # The coordination package has no engine manifest; its bridge block, invariants and plugin
  # exclusions live here. Its version source is .claude-plugin/plugin.json.
  claude_only_block: |
    - Read the workflow definitions in `agents/` and every engine `SKILL.md` directly; they are not
      registered with Claude Code's native `Skill` tool.
    - An engine's `CLAUDE.md` is a bridge that imports its `AGENTS.md`, so either file gives the
      same router.
  invariants:
    - id: book-extraction-ban
      phrase: "Never store book extractions in any engine or in this package: no"
    - id: not-assessed
      phrase: "Unavailable validation commands are reported as `NOT ASSESSED`, never"
  invariant_exemptions:
    british-english: "The coordination router has no British English output rule; the M10 binding rules carry it for plan outputs. Adding one is new doctrine outside M10-02."
  plugin_exclusions:
    - path: "adapters/*/skills/skills-engine-agents"
      reason: "host adapter entry skills (Claude Code, OpenCode) installed by the adapter installers, not by the chwezi-suite plugin"
    - path: "tests/fixtures/*-workspace/*"
      reason: "synthetic fixture engines for the fan-in, tour and skill-graph tests (M10-12); never shipped as a plugin skill"

