    decided_by: orchestrator under Peter's delegated authority, 29 Sep 2026
    decided_on: 2026-09-29
    review_after: 2026-12-29
    follow_up: later-wave (fix_alias; M10-04 closed before this register existed, so the meta-skill alias is a hand-off)

