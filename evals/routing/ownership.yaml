# Cross-engine skill ownership register (M10-03-T02).
#
# One entry per cross-engine skill pair (or group) whose union TF-IDF cosine is at or above 0.75.
# The check `scripts/validate-runtime-skill-budget.py --collisions --ownership evals/routing/ownership.yaml`
# fails on any pair >= 0.75 that is not declared here, and on a `fix_differentiate` pair that is still
# >= 0.75. A declared pair that falls below 0.60 is reported as a stale declaration (warning).
#
# This file is read ONLY by that check. No agent, router or loader reads it at runtime; it is a
# declaration, not a routing table (P04 still holds: no routing framework, loader or token target).
#
# Dispositions: canonical_owner | intentional_co_activation | mirrored_domain_pack | fix_differentiate | fix_alias
# Scores are the union lexical proxy (not live routing; see agent-skills issue #620).
# Keys use the catalogue engine id (`catalog/engines.yaml`): the digital research engine is
# `digital-research-skills` (checked out at `digital-research-engine/`).
schema_version: 1
thresholds: {error: 0.75, warn: 0.50}
pairs:
  - skills: [chwezi-dev-engine/validation-contract, digital-research-skills/validation-contract]
    score_at_decision: 1.00
    disposition: canonical_owner
    owner: chwezi-dev-engine/validation-contract
    co_activate: []
    reason: >-
      Identical shared doctrine (the seven evidence categories and the Release Evidence Bundle). The
      engineering-catalogue engine owns the contract; the research copy should become a pointer.
    decided_by: orchestrator under Peter's delegated authority, 29 Sep 2026
    decided_on: 2026-09-29
    review_after: 2026-12-29
    follow_up: later-wave (fix_alias; M10-04 closed before this register existed, so the meta-skill alias is a hand-off)

  - skills: [chwezi-dev-engine/ai-slop-audit, digital-research-skills/ai-slop-audit, chwezi-sdlc-documentation/29-ai-slop-audit]
